name: Physics package

on:
  push:
    branches: [dev, main]
    paths: [".github/workflows/physics.yml", "libraries/**", "examples/**", "tests/**", "scripts/**", "sagan-source-commit.txt"]
  pull_request:
    branches: [dev, main]
    paths: [".github/workflows/physics.yml", "libraries/**", "examples/**", "tests/**", "scripts/**", "sagan-source-commit.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux }
          - { runner: macos-latest, os: macos }
          - { runner: windows-latest, os: windows }
    steps:
      - uses: actions/checkout@v7
        with:
          path: physics
          persist-credentials: false
      - name: Resolve compiler source pin
        id: source
        shell: bash
        working-directory: physics
        run: |
          sha="$(tr -d '\r\n' < sagan-source-commit.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Sagan-Shoulak/sagan
          ref: ${{ steps.source.outputs.sha }}
          path: sagan-source
          fetch-depth: 0 # Version calculation requires the baseline commit history.
          persist-credentials: false
      - name: Set up MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-gcc
      - name: Build pinned compiler (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: sagan-source
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            make -j2 CXX=clang++ bin/sagan
          else
            make -j2 bin/sagan
          fi
      - name: Build pinned compiler (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: sagan-source
        run: make -j2 bin/sagan
      - name: Run headless numeric checks (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: physics
        run: |
          export SAGAN_EXECUTABLE="$GITHUB_WORKSPACE/sagan-source/bin/sagan"
          export SAGAN_PACKAGE_INDEX="$PWD/libraries/index.tsv"
          bash tests/integration/orbit_numeric_test.sh
          bash tests/integration/lagrange_numeric_test.sh
          bash tests/integration/solar_lagrange_numeric_test.sh
      - name: Run headless numeric checks (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: physics
        run: |
          export SAGAN_EXECUTABLE="$(cygpath -u "$GITHUB_WORKSPACE")/sagan-source/bin/sagan.exe"
          export SAGAN_PACKAGE_INDEX="$PWD/libraries/index.tsv"
          bash tests/integration/orbit_numeric_test.sh
          bash tests/integration/lagrange_numeric_test.sh
          bash tests/integration/solar_lagrange_numeric_test.sh
